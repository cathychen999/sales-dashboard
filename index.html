<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年众安信科销售业绩看板 V6</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:#080c18;color:#c8d6e5;min-height:100vh;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
.header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:52px;background:rgba(8,12,24,0.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(60,130,255,0.12)}
.header-l{display:flex;align-items:center;gap:12px}
.logo{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#1a73e8,#00b4d8);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff}
.header h1{font-size:15px;font-weight:700;letter-spacing:.5px;color:#fff}
.header-r{display:flex;align-items:center;gap:20px;font-size:11px;color:#5a7fa5}
.live-dot{width:7px;height:7px;background:#2ecc71;border-radius:50%;display:inline-block;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.nav{display:flex;gap:0;padding:0 28px;background:rgba(8,12,24,0.85);backdrop-filter:blur(12px);border-bottom:1px solid rgba(60,130,255,0.06)}
.nav-btn{padding:14px 22px;border:none;background:none;font-size:12.5px;color:#4a6580;cursor:pointer;font-weight:500;transition:all .25s;position:relative;letter-spacing:.3px;white-space:nowrap}
.nav-btn:hover{color:#7ba0d0}
.nav-btn.active{color:#4da6ff;font-weight:600}
.nav-btn.active::after{content:'';position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:60%;height:2px;background:#4da6ff;border-radius:1px}

.content{padding:20px 28px;max-width:1600px;margin:0 auto}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:rgba(14,20,36,0.7);border:1px solid rgba(60,130,255,0.1);border-radius:10px;padding:16px 18px;transition:all .25s;cursor:default}
.kpi-card:hover{border-color:rgba(60,130,255,0.25);box-shadow:0 4px 20px rgba(30,80,180,0.08)}
.kpi-label{font-size:10.5px;color:#4a6580;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.kpi-value{font-size:26px;font-weight:700;color:#e8f0ff;line-height:1.2}
.kpi-sub{font-size:10.5px;color:#4a6580;margin-top:4px}

.section-title{font-size:14px;font-weight:600;color:#8899b8;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(60,130,255,0.08);display:flex;align-items:center;gap:8px}
.section-title .dot{width:8px;height:8px;border-radius:50%;background:#4da6ff;flex-shrink:0}

.chart-box{background:rgba(14,20,36,0.6);border:1px solid rgba(60,130,255,0.08);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.chart-box.full{grid-column:1/-1}
.chart-box canvas{max-height:350px}

.chart-row{display:grid;gap:12px;margin-bottom:12px}
.chart-row.col2{grid-template-columns:1fr 1fr}
.chart-row.col3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1200px){.chart-row.col3{grid-template-columns:1fr 1fr}.chart-row.col2{grid-template-columns:1fr}}

/* Table */
.data-table{width:100%;border-collapse:collapse;font-size:12px}
.data-table thead{position:sticky;top:0;z-index:1}
.data-table th{padding:10px 12px;text-align:left;font-weight:600;font-size:11px;color:#5a7fa5;border-bottom:1px solid rgba(60,130,255,0.12);white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s}
.data-table th:hover{color:#7ba0d0}
.data-table th.sort-asc::after{content:' ▲';font-size:9px}
.data-table th.sort-desc::after{content:' ▼';font-size:9px}
.data-table th.num-header{text-align:right}
.data-table td{padding:9px 12px;border-bottom:1px solid rgba(60,130,255,0.04);color:#a8bdd0}
.data-table tr{cursor:pointer;transition:background .15s}
.data-table tbody tr:hover{background:rgba(60,130,255,0.04)}
.data-table td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.data-table td.hl{color:#4da6ff;font-weight:600}

/* Progress bar */
.progress-wrap{display:flex;align-items:center;gap:8px;min-width:120px}
.progress-bar{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .5s ease}
.progress-fill.high{background:linear-gradient(90deg,#1a73e8,#00b4d8)}
.progress-fill.mid{background:linear-gradient(90deg,#f39c12,#e67e22)}
.progress-fill.low{background:linear-gradient(90deg,#e74c3c,#c0392b)}
.progress-text{font-size:11px;font-weight:600;white-space:nowrap;min-width:40px}

/* Tags */
.tag{display:inline-block;padding:3px 8px;border-radius:4px;font-size:10.5px;font-weight:600;white-space:nowrap}
.tag-ok{background:rgba(46,204,113,0.12);color:#2ecc71}
.tag-warn{background:rgba(243,156,18,0.12);color:#f39c12}
.tag-danger{background:rgba(231,76,60,0.12);color:#e74c3c}
.tag-info{background:rgba(77,166,255,0.1);color:#4da6ff}
.tag-purple{background:rgba(142,68,173,0.12);color:#9b59b6}

.sub-nav{display:flex;gap:4px;margin-bottom:16px;background:rgba(14,20,36,0.4);border-radius:8px;padding:3px;width:fit-content}
.sub-nav button{padding:8px 20px;border:none;background:none;font-size:12px;color:#5a7fa5;cursor:pointer;border-radius:6px;font-weight:500;transition:all .2s}
.sub-nav button.active,.sub-nav button:hover{background:rgba(60,130,255,0.12);color:#4da6ff}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex;align-items:flex-start;justify-content:center;padding-top:60px}
.modal{background:#0f1629;border:1px solid rgba(60,130,255,0.15);border-radius:14px;max-width:900px;width:95%;max-height:80vh;overflow-y:auto;padding:28px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.modal h2{font-size:16px;font-weight:700;color:#e8f0ff;margin-bottom:20px}
.modal .close-btn{position:absolute;top:14px;right:18px;background:none;border:none;color:#5a7fa5;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:6px}
.modal .close-btn:hover{color:#e8f0ff;background:rgba(255,255,255,0.05)}

/* Client card */
.client-list{display:flex;flex-direction:column;gap:8px}
.client-card{display:flex;align-items:center;gap:12px;padding:14px 16px;background:rgba(14,20,36,0.5);border:1px solid rgba(60,130,255,0.06);border-radius:8px;cursor:pointer;transition:all .2s}
.client-card:hover{border-color:rgba(60,130,255,0.2);background:rgba(20,28,48,0.6)}
.client-rank{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.client-rank.top3{background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff}
.client-name{flex:1;font-weight:600;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.client-meta{display:flex;gap:16px;align-items:center;font-size:11px;flex-shrink:0}
.client-amount{font-weight:700;font-size:13px;color:#4da6ff;min-width:80px;text-align:right}

.empty-state{padding:40px;text-align:center;color:#4a6580;font-size:13px}
.rank-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:600;background:rgba(255,255,255,0.05);color:#5a7fa5}
.rank-num.top{background:linear-gradient(135deg,#1a73e8,#00b4d8);color:#fff}

/* Pie legend inline */
.pie-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pie-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#8899b8;background:rgba(255,255,255,0.02);padding:4px 8px;border-radius:4px}
.pie-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1200px){.grid-2{grid-template-columns:1fr}}

/* Summary bar */
.summary-bar{display:flex;gap:3px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.summary-item{font-size:10.5px;color:#5a7fa5;padding:4px 10px;background:rgba(255,255,255,0.02);border-radius:4px}
.summary-item strong{color:#8899b8}

.scroll-x{overflow-x:auto}
.summary-bar{display:flex;gap:12px;margin-bottom:14px;font-size:11px;color:#5a7fa5;flex-wrap:wrap;align-items:center}
.summary-bar .summary-item{white-space:nowrap}
.pie-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:10px}
.pie-item{display:inline-flex;align-items:center;gap:4px;color:#7a90b0}
.pie-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.scroll-x{overflow-x:auto}
</style>
</head>
<body>
<div class="header">
  <div class="header-l"><div class="logo">Z</div><h1>2026年众安信科销售业绩看板</h1></div>
  <div class="header-r"><span class="live-dot"></span>数据版本: 2026-07-30</div>
</div>
<div class="nav">
  <button class="nav-btn active" data-tab="team" onclick="switchTab('team')">销售团队总揽</button>
  <button class="nav-btn" data-tab="bd" onclick="switchTab('bd')">个人达成</button>
  <button class="nav-btn" data-tab="q3" onclick="switchTab('q3')">Q3业绩预测</button>
  <button class="nav-btn" data-tab="client" onclick="switchTab('client')">客户表现</button>
  <button class="nav-btn" data-tab="delay" onclick="switchTab('delay')">7月延迟&丢标</button>
</div>
<div id="content" class="content"></div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <button class="close-btn" onclick="closeModal()">&times;</button>
    <div id="modalContent"></div>
  </div>
</div>

  const rows=Array.from(tbody.querySelectorAll('tr'));
  rows.sort((a,b)=>{
    let va=a.dataset[key]||'',vb=b.dataset[key]||'';
    if(type==='num'){va=parseFloat(va)||0;vb=parseFloat(vb)||0;}
    return dir==='asc'?(va>vb?1:-1):(va<vb?1:-1);
  });
  rows.forEach(r=>tbody.appendChild(r));
}

function renderPie(tn,cid,lid){

        '<td class="num">'+(p.july_delay>0?fmtW(p.july_delay):'-')+'</td><td class="num">'+(p.july_ito>0?fmtW(p.july_ito):'-')+'</td>'+
        '<td class="num">'+(p.aug_predict>0?fmtW(p.aug_predict):'-')+'</td><td class="num">'+(p.sep_predict>0?fmtW(p.sep_predict):'-')+'</td>'+
        '<td class="num hl">'+fmtW(p.q3_total_predict)+'</td>'+
        '<td class="num"><span class="tag '+(p.q3_rate>=0.7?'tag-ok':p.q3_rate>=0.4?'tag-warn':'tag-danger')+'">'+pctV(p.q3_rate)+'【预估】</span></td></tr>';
    });
    h+='</tbody></table></div></div>';
    h+='<div style="padding:8px 16px;font-size:11px;color:#4a6580">* Q3目标=年度目标×30% | 7月实际=合同金额(O列) | ITO预测=202606月H列结算金额平摊到7/8/9月 | 8/9月=必拿商机+当月ITO</div>';
    ct.innerHTML=h;
    setTimeout(function(){makeSortable('q3Table');},100);
  }else{
    var preds=D.q3_bd_predictions.slice().sort(function(a,b){return b.q3_total_predict-a.q3_total_predict;});
    var h='<div class="chart-box full"><div class="section-title"><span class="dot"></span>Q3个人预测 ('+preds.length+'人)</div>'+
      '<div class="scroll-x"><table class="data-table" id="q3BdTable"><thead><tr>'+
      '<th data-sort="q3bname" data-type="str">姓名</th><th data-sort="q3bteam" data-type="str">团队</th>'+
      '<th class="num-header" data-sort="q3btarget" data-type="num">Q3目标</th>'+
      '<th class="num-header" data-sort="q3bjuly" data-type="num">7月实际</th>'+
      '<th class="num-header" data-sort="q3baug" data-type="num">8月预测</th>'+
      '<th class="num-header" data-sort="q3bsep" data-type="num">9月预测</th>'+
      '<th class="num-header" data-sort="q3btotal" data-type="num">Q3合计</th><th class="num-header">达成率</th></tr></thead><tbody>';
    preds.forEach(function(p){
      h+='<tr data-q3bname="'+p.name+'" data-q3bteam="'+p.team+'" data-q3btarget="'+p.q3_target+'" data-q3bjuly="'+p.july_actual+'" data-q3baug="'+p.aug_predict+'" data-q3bsep="'+p.sep_predict+'" data-q3btotal="'+p.q3_total_predict+'">'+
        '<td style="font-weight:600">'+p.name+'</td><td><span class="tag tag-info">'+p.team+'</span></td>'+
        '<td class="num">'+fmtW(p.q3_target)+'</td><td class="num">'+fmtW(p.july_actual)+'</td>'+
        '<td class="num">'+(p.aug_predict>0?fmtW(p.aug_predict):'-')+'</td><td class="num">'+(p.sep_predict>0?fmtW(p.sep_predict):'-')+'</td>'+
        '<td class="num hl">'+fmtW(p.q3_total_predict)+'</td><td class="num">'+pctV(p.q3_rate)+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
    ct.innerHTML=h;
    setTimeout(function(){makeSortable('q3BdTable');},100);
  }
}

function renderClient(c){
  var clients=D.clients;
  var totalAmount=clients.reduce(function(s,x){return s+x.total_wan;},0);
  var totalProject=clients.reduce(function(s,x){return s+(x.project_sign_wan||0);},0);
  var totalIto=clients.reduce(function(s,x){return s+(x.ito_fn_wan||0);},0);
  var h='<div class="kpi-row">'+
    '<div class="kpi-card"><div class="kpi-label">客户总数</div><div class="kpi-value">'+clients.length+'</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">累计签约金额</div><div class="kpi-value">'+fmtW(totalProject)+'</div><div class="kpi-sub">项目类(P列)</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">累计ITO金额</div><div class="kpi-value">'+fmtW(totalIto)+'</div><div class="kpi-sub">ITO结算(G列)</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">合计总金额</div><div class="kpi-value">'+fmtW(totalAmount)+'</div><div class="kpi-sub">项目签约+ITO</div></div>'+
    '<div class="kpi-card"><div class="kpi-label">Top 1客户</div><div class="kpi-value" style="font-size:18px">'+(clients[0]?clients[0].name:'-')+'</div><div class="kpi-sub">'+fmtW(clients[0]?clients[0].total_wan:0)+'</div></div></div>';

  h+='<div class="chart-row col2"><div class="chart-box"><div class="section-title"><span class="dot"></span>行业分布</div><canvas id="chartIndustry" style="max-height:260px"></canvas></div>'+
    '<div class="chart-box"><div class="section-title"><span class="dot"></span>中标类型分布</div><canvas id="chartBidType" style="max-height:260px"></canvas></div></div>';

  h+='<div class="chart-box full"><div class="section-title"><span class="dot"></span>客户排名（项目签约+ITO合计）</div><div class="client-list" style="max-height:600px;overflow-y:auto">';
  clients.slice(0,50).forEach(function(cl,i){
    var rank=i+1,rCls=rank<=3?'top3':'';
    h+='<div class="client-card" onclick="showClientDetail(\''+cl.name+'\')"><div class="client-rank '+rCls+'">'+rank+'</div>'+
      '<div class="client-name">'+cl.name+'</div><div class="client-meta"><span class="tag tag-info">'+(cl.industry||'-')+'</span>'+
      '<span style="color:#5a7fa5">'+cl.project_count+'单项目 + '+cl.ito_count+'单ITO</span></div>'+
      '<div class="client-amount">'+fmtW(cl.total_wan)+'</div></div>';
  });
  h+='</div></div>';
  c.innerHTML=h;

  setTimeout(function(){
    var ictx=document.getElementById('chartIndustry');
    if(ictx&&D.industries.length){
      safeChart(ictx,{type:'doughnut',data:{labels:D.industries.map(function(x){return x.name;}),datasets:[{data:D.industries.map(function(x){return x.amount;}),backgroundColor:C,borderColor:'rgba(8,12,24,1)',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'right',labels:{color:'#7a90b0',padding:12,font:{size:11}}},tooltip:{callbacks:{label:function(c){return c.label+': '+fmtW(c.raw)+' ('+(totalAmount>0?(c.raw/totalAmount*100).toFixed(1):0)+'%)';}}}}}});
    }
    var bctx=document.getElementById('chartBidType');
    if(bctx&&D.bid_types.length){
      safeChart(bctx,{type:'doughnut',data:{labels:D.bid_types.map(function(x){return x.name;}),datasets:[{data:D.bid_types.map(function(x){return x.amount;}),backgroundColor:C,borderColor:'rgba(8,12,24,1)',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'right',labels:{color:'#7a90b0',padding:12,font:{size:11}}},tooltip:{callbacks:{label:function(c){return c.label+': '+fmtW(c.raw)+' ('+(totalAmount>0?(c.raw/totalAmount*100).toFixed(1):0)+'%)';}}}}}});
    }
  },100);
}

function showClientDetail(cn){
  var drill=D.client_drill[cn];
  var cl=D.clients.find(function(x){return x.name===cn;});
  if(!drill)drill={projects:[],ito_items:[]};
  var projs=drill.projects||[],itos=drill.ito_items||[];
  var totalCount=projs.length+itos.length;
  var h='<h2>'+cn+' · 明细</h2><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">'+
    '<span class="tag tag-info">行业: '+(cl?cl.industry:'-')+'</span>'+
    '<span class="tag tag-ok">合计: '+fmtW(cl?cl.total_wan:0)+'</span>'+
    '<span class="tag tag-warn">'+projs.length+'个项目 + '+itos.length+'个ITO</span></div>';

  if(projs.length){
    var projTotal=projs.reduce(function(s,p){return s+(p.sign_amount_wan||0);},0);
    h+='<div class="section-title">项目类（签约金额P列） 合计: '+fmtW(projTotal)+' ('+projs.length+'条)</div><table class="data-table"><thead><tr><th>团队</th><th>BD</th><th>项目</th><th>类型</th><th>产品线</th><th class="num-header">签约金额</th><th>月份</th></tr></thead><tbody>';
    projs.sort(function(a,b){return (b.sign_amount_wan||0)-(a.sign_amount_wan||0);}).forEach(function(p){
      h+='<tr><td>'+(p.team||'-')+'</td><td>'+(p.bd||'-')+'</td><td>'+(p.project||'-')+'</td><td>'+(p.type||'-')+'</td>'+
        '<td>'+(p.product_line||'-')+'</td><td class="num hl">'+fmtW(p.sign_amount_wan)+'</td><td>'+(p.month_str||'-')+'</td></tr>';
    });
    h+='</tbody></table>';
  }

  if(itos.length){
    var itoTotal=itos.reduce(function(s,i){return s+(i.kpi_amount||0);},0);
    h+='<div class="section-title" style="margin-top:12px">ITO结算（KPI-H列 / 财务-G列） 合计: '+fmtW(itoTotal/10000)+'万 ('+itos.length+'条)</div><table class="data-table"><thead><tr><th>团队</th><th>BD</th><th>项目</th><th>月份</th><th class="num-header">财务金额(G)</th><th class="num-header">KPI金额(H)</th></tr></thead><tbody>';
    itos.sort(function(a,b){return (b.kpi_amount||0)-(a.kpi_amount||0);}).forEach(function(s){
      h+='<tr><td>'+(s.team||'-')+'</td><td>'+(s.bd||'-')+'</td><td>'+(s.project||'-')+'</td><td>'+(s.month||'-')+'</td>'+
        '<td class="num">'+fmtW(s.fn_amount/10000)+'</td><td class="num hl">'+fmtW(s.kpi_amount/10000)+'</td></tr>';
    });
    h+='</tbody></table>';
  }

  if(!projs.length&&!itos.length)h+='<div class="empty-state">暂无明细</div>';
  openModal(h);
}

    '<div class="kpi-card" style="border-left:2px solid #e74c3c"><div class="kpi-label">丢标商机</div><div class="kpi-value">'+fmtW(D.delay_summary.loss_total)+'</div><div class="kpi-sub">'+D.delay_summary.loss_count+'条</div></div>'+

  h+='<div class="chart-box full"><div class="section-title"><span class="dot"></span>延迟商机 ('+(D.delay_summary.delay_count||0)+'条)</div><div class="scroll-x"><table class="data-table" id="delayTable"><thead><tr>'+
    '<th data-sort="dteam" data-type="str">团队</th><th data-sort="dbd" data-type="str">BD</th>'+
    '<th data-sort="dclient" data-type="str">客户</th><th data-sort="dproject" data-type="str">项目</th>'+

    '<th data-sort="dctype" data-type="str">客户类型</th></tr></thead><tbody>';

  items.filter(function(x){return x.status==='延迟';}).sort(function(a,b){return b.amount_wan-a.amount_wan;}).forEach(function(d){
    h+='<tr data-dteam="'+d.team+'" data-dbd="'+d.bd+'" data-dclient="'+d.client+'" data-dproject="'+d.project+'" data-dpline="'+d.product_line+'" data-damount="'+d.amount_wan+'" data-dctype="'+d.client_type+'">'+
      '<td><span class="tag tag-info">'+d.team+'</span></td><td style="font-weight:600">'+d.bd+'</td>'+
      '<td>'+d.client+'</td><td>'+d.project+'</td><td>'+d.product_line+'</td>'+
      '<td class="num hl" style="color:#f39c12">'+d.amount_wan.toFixed(1)+'万</td><td>'+d.client_type+'</td></tr>';
  });
  h+='</tbody></table></div></div>';

  h+='<div class="chart-box full"><div class="section-title"><span class="dot"></span>丢标商机 ('+(D.delay_summary.loss_count||0)+'条)</div><table class="data-table"><thead><tr>'+
    '<th>团队</th><th>BD</th><th>客户</th><th>项目</th><th>产品线</th><th class="num-header">金额(万)</th></tr></thead><tbody>';
  items.filter(function(x){return x.status==='丢标';}).sort(function(a,b){return b.amount_wan-a.amount_wan;}).forEach(function(d){
    h+='<tr><td><span class="tag tag-info">'+d.team+'</span></td><td style="font-weight:600">'+d.bd+'</td>'+
      '<td>'+d.client+'</td><td>'+d.project+'</td><td>'+d.product_line+'</td>'+
      '<td class="num hl" style="color:#e74c3c">'+d.amount_wan.toFixed(1)+'万</td></tr>';

  h+='</tbody></table></div>';

  h+='<div style="padding:12px 16px;font-size:11px;color:#4a6580;line-height:1.6"><strong>说明：</strong>延迟商机指原计划7月必拿但因客观原因推迟的商机，将纳入8-9月重新预测。若计入延迟，7月可达 '+fmtW((D.summary.achieve_1_7||0)+D.delay_summary.delay_total)+'。丢标商机已确认流失。</div>';
  c.innerHTML=h;
  setTimeout(function(){makeSortable('delayTable');},100);
}

(function init(){
  var c=document.getElementById('content');
  renderTeam(c);
})();
